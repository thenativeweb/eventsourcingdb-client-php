name: Release

on:
  push:
    branches:
      - 'main'

permissions:
  contents: write

jobs:
  qa:
    name: QA (${{ matrix.image-tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        image-tag: [ latest, preview ]

    steps:
    - name: Clone repository
      uses: actions/checkout@v7.0.1
    - name: Use PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        tools: composer
    - name: Install dependencies
      run: |
        composer install
    - name: Run QA
      env:
        EVENTSOURCINGDB_IMAGE_TAG: ${{ matrix.image-tag }}
      run: |
        composer qa

  release:
    name: Release
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Clone repository
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Get next version
      id: get_next_version
      uses: thenativeweb/get-next-version@2.8.1
    - name: Create new version
      if: ${{ steps.get_next_version.outputs.hasNextVersion == 'true' }}
      run: |
        git tag ${{ steps.get_next_version.outputs.version }}
        git push origin ${{ steps.get_next_version.outputs.version }}
